name: Deploy to GitHub Pages

# Builds the site, prerenders every route to its own HTML file (so each URL returns 200 with real
# content) and publishes dist/ to the gh-pages branch. The repo's Pages source is
# Settings -> Pages -> "Deploy from a branch" (gh-pages, /), so GitHub publishes the branch as soon
# as it is pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sitemap lastmod dates can come from git.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keep only the latest build in the branch history.
          force_orphan: true
