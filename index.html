<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F4" />
    <title>Surf &amp; Retreat Hostel Weligama</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/plus-jakarta-sans-latin.woff2">
    <!-- Per-route description, canonical, Open Graph and JSON-LD are written here by scripts/prerender.mjs. -->
    <!--seo-head-->
    <!-- Largest-contentful image: fetch the same file the hero <img> will request. -->
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%images/scooter-surfboard.webp"
      imagesrcset="%BASE_URL%images/scooter-surfboard-400.webp 400w, %BASE_URL%images/scooter-surfboard-800.webp 800w, %BASE_URL%images/scooter-surfboard-1200.webp 1200w, %BASE_URL%images/scooter-surfboard.webp 1280w"
      imagesizes="(max-width: 1024px) 100vw, 60vw"
      fetchpriority="high"
    >
  </head>
  <body class="bg-[#F6F7F4] text-[#1E2721] font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-[#D8E95E] selection:text-[#193B26]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
