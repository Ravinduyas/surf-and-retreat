    <!-- The manifest link is deliberately absent. VitePWA writes the manifest
         and injects the link itself at build time, so a hand-written one was
         emitted twice in every built page — and in dev, where the plugin is
         switched off, it pointed at a file that does not exist: the SPA
         fallback answered with index.html and the browser reported the
         manifest as a syntax error on line 1. It is defined in vite.config.ts. -->
    <title>helio.pms — Property Management Suite</title>
  </head>
